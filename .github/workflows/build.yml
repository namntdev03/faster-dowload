# Build FastDL cho macOS (Apple Silicon + Intel), Windows, Linux.
# - Push/PR lên main: build và đính kèm file cài đặt vào trang Actions (tải về trong mục Artifacts).
# - Push tag dạng v0.1.0: build và tạo bản Release nháp trên GitHub kèm file cài đặt.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test
        if: matrix.name != 'macos-x64'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Đóng gói
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../../dist/fastdl-cli-${{ matrix.name }}.zip fastdl.exe
          else
            tar czf ../../../dist/fastdl-cli-${{ matrix.name }}.tar.gz fastdl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Thư viện hệ thống (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target
          key: app-${{ matrix.target }}
      - name: Cài gói npm
        working-directory: gui
        run: npm ci
      - name: Build app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: --target ${{ matrix.target }}
          # Chỉ tạo Release khi push tag v*
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: FastDL ${{ github.ref_name }}
          releaseBody: |
            Bản cài đặt app (dmg, msi, exe, deb, AppImage) và công cụ dòng lệnh `fastdl` cho từng hệ điều hành.
            macOS: app ký ad-hoc, lần đầu mở bằng chuột phải → Open.
          releaseDraft: true
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: fastdl-app-${{ matrix.name }}
          path: |
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            gui/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # Chỉ chạy khi push tag v*: gắn bản CLI vào Release rồi công khai.
  release:
    name: Phát hành
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag phải khớp version trong Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} không khớp version $v trong Cargo.toml"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: fastdl-cli-*
          path: dist
          merge-multiple: true
      - name: Đính kèm CLI và công khai Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/* --clobber
          gh release edit "${{ github.ref_name }}" --draft=false
