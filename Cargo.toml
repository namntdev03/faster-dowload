[package]
name = "fastdl"
version = "0.2.0"
edition = "2021"
description = "Trình tải file/video đa kết nối tốc độ cao (kiểu IDM) viết bằng Rust"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "native-tls", "stream"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
